name: Audit qualité

on:
  pull_request:
  push:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # pnpm depuis `packageManager` ; Node aligné sur NODE_VERSION (netlify.toml).
      - uses: pnpm/setup@v3
        with:
          runtime: node@24
          cache: true
          require-lockfile: true

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Tests
        run: pnpm test

      - name: Build (SSG)
        run: pnpm generate

      # Ne valide pas HSTS/CSP (localhost HTTP) : rôle du plugin Netlify.
      - name: Lighthouse
        run: pnpm audit:lighthouse
