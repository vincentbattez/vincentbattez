[build]
command = "pnpm generate"
publish = "dist"

[functions]
directory = "netlify/functions"

[build.environment]
NODE_VERSION = "22"
# Sans ça, le runtime des Functions peut rester sur nodejs16.x (déprécié).
AWS_LAMBDA_JS_RUNTIME = "nodejs22.x"

# Seul point qui valide HSTS/CSP (invisibles sur localhost). Non bloquant : les
# échecs de contraste sur les couleurs de marque sont assumés.
[[plugins]]
package = "@netlify/plugin-lighthouse"

  [plugins.inputs]
  output_path = "reports/lighthouse.html"

  [plugins.inputs.audits]
  path = "index.html"

  # [plugins.inputs.thresholds]
  # performance = 0.9
  # seo = 1.0
  # best-practices = 0.95
  # accessibility = 0.9

[[headers]]
for = "/*"

[headers.values]
X-Content-Type-Options = "nosniff"
X-Frame-Options = "DENY"
Referrer-Policy = "strict-origin-when-cross-origin"
Permissions-Policy = "camera=(), microphone=(), geolocation=()"
Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
# Sans script-src/style-src : nonces impraticables en SSG + importmap inline.
# Le volet anti-XSS strict reste à faire.
Content-Security-Policy = "base-uri 'self'; object-src 'none'; form-action 'self'; frame-ancestors 'none'"

[[headers]]
for = "/_nuxt/*"

[headers.values]
Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
for = "/_fonts/*"

[headers.values]
Cache-Control = "public, max-age=31536000, immutable"

# Non fingerprintés : renommer le fichier pour invalider.
[[headers]]
for = "/images/*"

[headers.values]
Cache-Control = "public, max-age=604800"

[[headers]]
for = "/og/*"

[headers.values]
Cache-Control = "public, max-age=604800"

[[headers]]
for = "/favicon.ico"

[headers.values]
Cache-Control = "public, max-age=604800"

[[headers]]
for = "/manifest.webmanifest"

[headers.values]
Content-Type = "application/manifest+json"

# Charset explicite : accents français lourds.
[[headers]]
for = "/llms.txt"

[headers.values]
Content-Type = "text/plain; charset=utf-8"

[[headers]]
for = "/llms-full.txt"

[headers.values]
Content-Type = "text/plain; charset=utf-8"
